name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Test packaged import
        run: |
          eve_version=$(node -p 'require("./package.json").devDependencies.eve')
          smoke_directory=$(mktemp -d)
          cd "$smoke_directory"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/supermemory-eve-*.tgz "eve@$eve_version"
          node --input-type=module --eval 'import("@supermemory/eve").then((module) => { if (typeof module.default !== "function") process.exit(1); })'
      - name: Check whether version is published
        id: publication
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";

          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          const response = await fetch(
            `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`,
            { signal: AbortSignal.timeout(30_000) },
          );

          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status} for ${name}@${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${response.status === 404}\n`);
          console.log(response.status === 404 ? `Publishing ${name}@${version}` : `${name}@${version} is already published; skipping`);
          EOF
      - name: Publish to npm
        if: steps.publication.outputs.publish == 'true'
        run: npm publish "$RUNNER_TEMP"/supermemory-eve-*.tgz --access public
